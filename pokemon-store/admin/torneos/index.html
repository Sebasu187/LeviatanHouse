<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torneos — Panel POS Leviatán House</title>
  <link rel="icon" href="/Images/LeviaLogoEstandar-Photoroom.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin-pos.css" />
</head>
<body>
  <div class="pos-app">
    <aside class="pos-sidebar" id="posSidebar"></aside>

    <main class="pos-main">
      <div class="pos-header">
        <div>
          <h1>Torneos</h1>
          <p>Crea, edita y publica los resultados de los torneos.</p>
        </div>
        <div class="pos-header__actions">
          <button class="btn btn--primary" id="newTournamentBtn">+ Crear torneo</button>
        </div>
      </div>

      <div id="tournamentsListWrap" class="pos-table-wrap" style="padding:20px;">
        <div id="tournamentsList" class="orders-list"></div>
      </div>
    </main>
  </div>

  <nav class="pos-mobile-nav" id="posMobileNav"></nav>

  <!-- MODAL: CREAR / EDITAR TORNEO -->
  <div class="pos-modal-overlay" id="tournamentModalOverlay">
    <div class="pos-modal" id="tournamentModalContent" style="max-width:520px;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/data.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/auth.js"></script>
  <script src="/admin-pos-layout.js"></script>
  <script src="/admin/torneos/torneos-admin.js"></script>
</body>
</html>
