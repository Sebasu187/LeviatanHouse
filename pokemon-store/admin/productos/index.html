<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos e inventario — Panel POS Leviatán House</title>
  <link rel="icon" href="/Images/LeviaLogoEstandar-Photoroom.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin-pos.css" />
</head>
<body>
  <div class="pos-app">
    <aside class="pos-sidebar" id="posSidebar"></aside>

    <main class="pos-main">
      <div class="pos-header">
        <div>
          <h1>Productos e inventario</h1>
          <p>Gestiona el catálogo, precios y existencias de la tienda.</p>
        </div>
        <div class="pos-header__actions">
          <a href="/admin/productos/nuevo/index.html" class="btn btn--primary">+ Crear producto</a>
        </div>
      </div>

      <div class="pos-toolbar">
        <div class="pos-search">
          <span class="pos-search__icon">🔍</span>
          <input type="text" id="posSearchInput" placeholder="Buscar por nombre, SKU o código de barras" />
        </div>
        <select class="pos-select" id="posCategoryFilter">
          <option value="todas">Todas las categorías</option>
        </select>
        <select class="pos-select" id="posStatusFilter">
          <option value="todos">Todos los estados</option>
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
          <option value="stock_bajo">Stock bajo</option>
          <option value="agotado">Agotado</option>
        </select>
      </div>

      <div class="pos-table-wrap">
        <div id="posProductsContainer"></div>
      </div>
    </main>
  </div>

  <nav class="pos-mobile-nav" id="posMobileNav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/data.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/auth.js"></script>
  <script src="/admin-pos-layout.js"></script>
  <script src="/admin/productos/productos.js"></script>
</body>
</html>
