<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba aislada — ePayco</title>
  <script src="https://checkout.epayco.co/checkout-v2.js"></script>
</head>
<body>
  <h1>Prueba mínima de ePayco (sin nada más del sitio)</h1>
  <button id="pagar">Pagar $10.000 de prueba</button>

  <script>
    var handler = ePayco.checkout.configure({
      key: '61b761602422edb9fc580170d0f9e295a22e9e24',
      test: true
    });

    document.getElementById('pagar').addEventListener('click', function () {
      handler.open({
        name: "Producto de prueba",
        description: "Prueba aislada",
        invoice: "PRUEBA-" + Date.now(),
        currency: "cop",
        amount: "10000",
        tax_base: "0",
        tax: "0",
        country: "co",
        lang: "es",
        external: "false"
      });
    });
  </script>
</body>
</html>
