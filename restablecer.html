<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña — Leviatán House</title>
  <link rel="icon" href="Images/LeviaLogoEstandar-Photoroom.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="navbar__brand" style="text-decoration:none;">
      <span class="navbar__mark">◆</span>
      <img src="Images/LeviaLogoEstandar-Photoroom.png" alt="Leviatan House Logo" width="75" height="75" />
      <span class="navbar__name">LEVIATAN HOUSE</span>
    </a>
  </header>

  <section class="auth-page">
    <div class="auth-box">
      <h3 style="font-family: var(--font-display); font-size: 24px; color: var(--parchment); margin-bottom: 20px;">
        Nueva contraseña
      </h3>

      <form id="resetForm" class="auth-form">
        <label>Nueva contraseña
          <div class="password-field">
            <input type="password" name="password" minlength="6" required />
            <button type="button" class="password-toggle" aria-label="Mostrar contraseña">👁</button>
          </div>
        </label>
        <label>Confirmar contraseña
          <div class="password-field">
            <input type="password" name="confirmPassword" minlength="6" required />
            <button type="button" class="password-toggle" aria-label="Mostrar contraseña">👁</button>
          </div>
        </label>
        <p class="auth-error" id="resetError" hidden></p>
        <p class="auth-success" id="resetSuccess" hidden></p>
        <button type="submit" class="btn btn--primary btn--full">Guardar nueva contraseña</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 Leviatán House. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('resetError');
      const successEl = document.getElementById('resetSuccess');
      errorEl.hidden = true;
      successEl.hidden = true;

      const formData = new FormData(e.target);
      if (formData.get('password') !== formData.get('confirmPassword')) {
        errorEl.textContent = 'Las contraseñas no coinciden.';
        errorEl.hidden = false;
        return;
      }

      const { error } = await sb.auth.updateUser({ password: formData.get('password') });

      if (error) {
        errorEl.textContent = 'No se pudo actualizar. El link puede haber expirado — solicita uno nuevo.';
        errorEl.hidden = false;
        return;
      }

      successEl.textContent = '¡Contraseña actualizada! Ya puedes iniciar sesión.';
      successEl.hidden = false;
      e.target.reset();
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    });
  </script>
</body>
</html>
